name: iac-security-scan

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  trivy_config:
    name: trivy config (high/critical)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

## safe action version following aquasec breach
      - name: Trivy config scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          output: trivy-config-results.txt
          hide-progress: true

      - name: Upload scan report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-config-results
          path: trivy-config-results.txt
